<script>
// Applies whatever theme/dark-mode the main app currently has active, read straight
// from the same-origin localStorage key it writes to. Mirrors applyThemeState() and
// applySeasonalTheme() in index.html exactly (including the "no explicit choice yet
// -> fall back to the date-driven seasonal theme" case), minus the bits that don't
// apply to this page (persisting, the toggle icon, the title-color DOM hack, National
// Day's one-time fireworks/centering - none of them have anything to act on here).
// Runs synchronously before any content below is parsed, so there's no flash of the
// wrong theme.
(function(){
  function tashkentEffectiveDay(){
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tashkent', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hour12:false
    }).formatToParts(new Date());
    function get(t){ for(var i=0;i<parts.length;i++){ if(parts[i].type===t) return parts[i].value; } }
    var y = +get('year'), mo = +get('month'), d = +get('day'), h = +get('hour');
    var dayObj = new Date(Date.UTC(y, mo-1, d));
    if(h < 4){ dayObj.setUTCDate(dayObj.getUTCDate() - 1); }
    return dayObj.toISOString().slice(0,10);
  }
  var SEASONAL_THEMES = [
    { key:'firstday',  start:'2026-08-29', end:'2026-08-31' },
    { key:'christmas', start:'2026-12-24', end:'2026-12-26' },
    { key:'newyear',   start:'2026-12-31', end:'2027-01-02' },
    { key:'ramadan',   start:'2027-02-08', end:'2027-03-09' },
    { key:'eidfitr',   start:'2027-03-10', end:'2027-03-12' },
    { key:'nowruz',    start:'2027-03-20', end:'2027-03-22' },
    { key:'eidadha',   start:'2027-05-15', end:'2027-05-17' },
  ];
  var USER_THEME_KEYS = ['ihl','arsenal','arsenal2','uzbekistan2','soviet','bazaar','hacker','nebula','synthwave','bauhaus','vintage','d1','dihl','darsenal','dvintage'];
  var body = document.body;
  var key = null;
  try{ key = localStorage.getItem('themeChoice'); }catch(e){}
  if(key === null){
    var today = tashkentEffectiveDay();
    var active = null;
    for(var i=0;i<SEASONAL_THEMES.length;i++){
      var t = SEASONAL_THEMES[i];
      if(today >= t.start && today <= t.end){ active = t; break; }
    }
    if(active) body.classList.add('theme-' + active.key);
    return;
  }
  if(key !== 'default' && key !== 'nationalday' && USER_THEME_KEYS.indexOf(key) === -1){
    key = 'default';
  }
  var isDark = key !== 'default' && key !== 'nationalday' && key.charAt(0) === 'd';
  if(isDark) body.classList.add('dark-mode');
  if(key === 'nationalday'){
    body.classList.add('theme-nationalday');
  } else if(key !== 'default'){
    body.classList.add('usertheme-' + key);
  }
})();
</script>

<script>
(function(){

var GG_PER_SET = 20;
var GG_LEVELS = [
  { key:'easy',   label:'Easy',   sub:'Simple, clear-cut sentences' },
  { key:'medium', label:'Medium', sub:'Mixed forms, questions, dialogues' },
  { key:'hard',   label:'Hard',   sub:'Tricky cases, tags, corrections' }
];
var ICON = {book:"<svg viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5a2.5 2.5 0 0 1-2.5 2.5H4V5.5Z\"/><path d=\"M4 18.5A2.5 2.5 0 0 1 6.5 16H20\"/></svg>",search:"<svg viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.8-3.8\"/></svg>"};
function icon(n){ return ICON[n] || ''; }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexToRgba(hex, a){ var h = hex.replace('#',''); return 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16) + ',' + a + ')'; }
// Same localStorage keys the main app used (ggs_<topic>_<level>), so saved progress carries over.
function ggKey(topic, level){ return 'ggs_' + topic + '_' + level; }
function ggLoad(topic, level){ try{ var raw = localStorage.getItem(ggKey(topic, level)); if(raw) return JSON.parse(raw); }catch(e){} return null; }
function ggSave(topic, level, st){ try{ localStorage.setItem(ggKey(topic, level), JSON.stringify(st)); }catch(e){} }
var DATA_V = '5e34470532';
function getJson(u){ return fetch(u + '?v=' + DATA_V).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
var INDEX_P = null, TOPIC_P = {};
function loadIndex(){ if(!INDEX_P) INDEX_P = getJson('data/grammar/index.json').catch(function(e){ INDEX_P = null; throw e; }); return INDEX_P; }
var FALLBACK = { m:['Tom','Aziz','Ali','Sam','Karim'], f:['Anna','Dilya','Malika','Sara','Kim'], s:['Karimov','Smith','Garcia'], c:['London','Paris','Tashkent','Rome'], k:['Spain','Japan','Brazil'], l:['Spanish','French','German'], p:['park','library','station','hotel'], j:['teacher','doctor','pilot','nurse'] };
var POOLS_P = null;
function loadPools(){ if(!POOLS_P) POOLS_P = getJson('data/grammar/pools.json').catch(function(){ return FALLBACK; }); return POOLS_P; }
var POOLS = FALLBACK;
// Fills the {m0} {f1} {s0} {c0} {k0} {l0} {p0} {j0} slots of one bank item with fresh random values
// (same slot = same value everywhere in the item, different slots = different values).
function ggFill(it){
  var found = {}, order = [];
  function scan(s){ String(s).replace(/\{([mfscklpj])(\d)\}/g, function(t){ if(!found[t]){ found[t] = 1; order.push(t); } return t; }); }
  scan(it.q); it.a.forEach(function(g){ g.forEach(scan); });
  if(!order.length) return { q: it.q, a: it.a };
  var val = {}, usedPerCat = {}, usedNames = [];
  order.forEach(function(t){
    var cat = t.charAt(1), arr = POOLS[cat] || FALLBACK[cat], pool = (cat === 'm' || cat === 'f') ? usedNames : (usedPerCat[cat] = usedPerCat[cat] || []), v = arr[0];
    for(var k = 0; k < 40; k++){ v = arr[Math.floor(Math.random() * arr.length)]; if(pool.indexOf(v) < 0) break; }
    pool.push(v); val[t] = v;
  });
  function sub(s){ return String(s).replace(/\{([mfscklpj])(\d)\}/g, function(t){ return val[t] != null ? val[t] : t; }); }
  return { q: sub(it.q), a: it.a.map(function(g){ return g.map(sub); }) };
}
function loadTopic(id){ if(!TOPIC_P[id]) TOPIC_P[id] = getJson('data/grammar/' + encodeURIComponent(id) + '.json').catch(function(e){ delete TOPIC_P[id]; throw e; }); return TOPIC_P[id]; }

// - answer normalisation -
const GG_VOCAB = { movie:'film', movies:'films', soccer:'football', apartment:'flat', apartments:'flats', cookie:'biscuit', cookies:'biscuits',
  candy:'sweets', vacation:'holiday', vacations:'holidays', truck:'lorry', sneakers:'trainers', gas:'petrol', elevator:'lift', subway:'underground',
  trash:'rubbish', pants:'trousers', mom:'mum', moms:'mums', gotten:'got', gray:'grey', jewelry:'jewellery', pajamas:'pyjamas', aluminum:'aluminium',
  practise:'practice', practised:'practiced', practising:'practicing', license:'licence', defense:'defence', offense:'offence', catalog:'catalogue',
  dialog:'dialogue', plow:'plough', mold:'mould', cozy:'cosy', donut:'doughnut', color:'colour' };
function ggCanon(s){
  s = String(s == null ? '' : s).toLowerCase().replace(/[‘’ʼ´`]/g, "'");
  s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'cannot').replace(/\bshan't\b/g, 'shall not')
       .replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will')
       .replace(/\b(he|she|it|that|there|here|what|who|where|how|when|why)'s\b/g, '$1 is')
       .replace(/(^|\s)'s\b/g, ' is');
  s = s.replace(/\bcan not\b/g, 'cannot');
  // apostrophes are optional: "isnt", "doesnt", "im", "theyre" etc. count the same as the contracted form
  s = s.replace(/\b(is|are|was|were|do|does|did|has|have|had|could|would|should|must|need)nt\b/g, '$1 not')
       .replace(/\bcant\b/g, 'cannot').replace(/\bwont\b/g, 'will not').replace(/\bshant\b/g, 'shall not')
       .replace(/\bim\b/g, 'i am').replace(/\b(you|we|they)re\b/g, '$1 are').replace(/\b(you|we|they)ve\b/g, '$1 have')
       .replace(/\b(he|she|that|there|what|who|where|how)s\b/g, '$1 is');
  s = s.replace(/\b(\w{3,})iz(e|es|ed|ing|ation|ations)\b/g, '$1is$2').replace(/\b(\w{3,})yz(e|es|ed|ing)\b/g, '$1ys$2');
  s = s.replace(/\b(colo|favo|neighbo|hono|humo|flavo|labo|behavio|harbo|rumo|vapo|savo|odo|armo)r(s|ed|ing|ite|ites|ful|less|able)?\b/g, '$1ur$2');
  s = s.replace(/\b(cent|theat|met|fib|lit)er(s|ed|ing)?\b/g, '$1re$2');
  s = s.replace(/\b(travel|cancel|label|model|fuel|signal|counsel|marvel|quarrel|level|total|equal|dial|enrol|fulfil)l?(ed|ing|er|ers)\b/g, '$1l$2');
  s = s.replace(/\b(burn|spill|learn|dream|smell|spell|lean|leap)t\b/g, '$1ed');
  s = s.replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/\b[a-z]+\b/g, w => GG_VOCAB[w] || w);
  return s;
}
function ggBlankOk(typed, accepted){
  const t = ggCanon(typed);
  if(!t) return false;
  for(let i = 0; i < accepted.length; i++){ if(ggCanon(accepted[i]) === t) return true; }
  return false;
}


// - drawing a set -
function ggDraw(topic, level, avoid){
  const pool = ((topic.levels || {})[level]) || [];
  const idx = pool.map((_, i) => i);
  const avoidSet = new Set(avoid || []);
  let fresh = idx.filter(i => !avoidSet.has(i));
  const shuffle = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  shuffle(fresh);
  let pick = fresh.slice(0, GG_PER_SET);
  if(pick.length < GG_PER_SET){
    const rest = shuffle(idx.filter(i => avoidSet.has(i)));
    pick = pick.concat(rest.slice(0, GG_PER_SET - pick.length));
  }
  shuffle(pick);
  return {
    idx: pick,
    items: pick.map(i => ggFill(pool[i])),
    ans: pick.map(i => pool[i].a.map(function(){ return ''; })),
    ok: pick.map(() => null),          // per item: null (unchecked) | true | false
    bl: pick.map(i => pool[i].a.map(function(){ return null; })), // per blank result
    checked: false,
    score: null,
    ts: Date.now(),
  };
}
function ggFilled(st){ return st.ans.filter(a => a.every(x => String(x).trim() !== '')).length; }


function ggItemHtml(it, n, ansRow, blRow, okVal){
  const segs = it.q.split('___');
  const hasBlank = segs.length > 1;
  let h = '';
  if(hasBlank){
    segs.forEach((seg, bi) => {
      h += escapeHtml(seg);
      if(bi < segs.length - 1){
        const v = ansRow[bi] || '';
        const cls = blRow[bi] === true ? ' gg-ok' : (blRow[bi] === false ? ' gg-bad' : '');
        h += `<input type="text" class="gg-inp${cls}" data-b="${bi}" value="${escapeHtml(v)}"${okVal === true ? ' readonly' : ''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">`;
      }
    });
  } else {
    const v = ansRow[0] || '';
    const cls = blRow[0] === true ? ' gg-ok' : (blRow[0] === false ? ' gg-bad' : '');
    h = escapeHtml(it.q) + `<input type="text" class="gg-inp gg-wide${cls}" data-b="0" value="${escapeHtml(v)}"${okVal === true ? ' readonly' : ''} placeholder="Type the full sentence…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">`;
  }
  const mark = okVal === true ? ' gg-item-ok' : (okVal === false ? ' gg-item-bad' : '');
  return `<div class="gg-item${mark}" data-i="${n}"><span class="gg-num">${n + 1}</span><div class="gg-q${hasBlank ? '' : ' gg-q-block'}">${h}</div></div>`;
}
function ggWireExercise(app, bank, topicId, level){
  const topic = bank.topics.find(t => t.id === topicId);
  const lv = GG_LEVELS.find(l => l.key === level);
  const root = app.querySelector('#ggExercise');
  if(!topic || !lv || !(topic.levels[level] || []).length){ root.innerHTML = '<div class="empty-card">Exercise not found.</div>'; return; }
  let st = ggLoad(topicId, level);
  const valid = st && Array.isArray(st.items) && st.items.length && Array.isArray(st.ans) && st.items.length === st.ans.length;
  if(!valid){ st = ggDraw(topic, level, st && st.idx); ggSave(topicId, level, st); }
  function render(scrollTop){
    const done = st.checked && st.score === GG_PER_SET;
    root.innerHTML = `
      <div class="section-head"><span class="emoji">${icon('book')}</span><h2>${escapeHtml(topic.name)}</h2></div>
      <div class="gg-meta"><span class="gg-lvl">${lv.label}</span><span id="ggProg"></span></div>
      <div class="gg-banner" id="ggBanner" style="display:none;"></div>
      <div class="gg-list" id="ggList">${st.items.map((it, n) => ggItemHtml(it, n, st.ans[n], st.bl[n], st.ok[n])).join('')}</div>
      <div class="gg-actions">
        <button class="gg-btn gg-btn-main" id="ggCheck">Check</button>
        <button class="gg-btn" id="ggAgain">Reset</button>
      </div>
      <div class="gg-banner" id="ggBanner2" style="display:none;"></div>`;
    updateProg(); showBanner();
    wire();
    if(scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function updateProg(){
    const p = root.querySelector('#ggProg');
    if(p) p.textContent = ggFilled(st) + '/' + GG_PER_SET + ' answered';
  }
  function showBanner(){
    ['#ggBanner', '#ggBanner2'].forEach(sel => {
      const b = root.querySelector(sel);
      if(!b) return;
      if(!st.checked){ b.style.display = 'none'; return; }
      b.style.display = '';
      b.className = 'gg-banner ' + (st.score === GG_PER_SET ? 'gg-banner-ok' : 'gg-banner-mid');
      b.textContent = st.score === GG_PER_SET ? '20/20. Perfect! Tap Reset for a new set.' : st.score + '/' + GG_PER_SET + ' correct. Fix the red ones and check again.';
    });
  }
  // Marks results in place (no re-render) so the page never jumps while checking.
  function applyResults(){
    root.querySelectorAll('.gg-item').forEach(item => {
      const n = +item.dataset.i;
      item.classList.toggle('gg-item-ok', st.ok[n] === true);
      item.classList.toggle('gg-item-bad', st.ok[n] === false);
      item.querySelectorAll('.gg-inp').forEach(inp => {
        const r = st.bl[n][+inp.dataset.b];
        inp.classList.toggle('gg-ok', r === true);
        inp.classList.toggle('gg-bad', r === false);
        inp.readOnly = st.ok[n] === true;
      });
    });
    showBanner(); updateProg();
  }
  function wire(){
    root.querySelectorAll('.gg-inp').forEach(inp => {
      inp.addEventListener('input', () => {
        const item = inp.closest('.gg-item'), n = +item.dataset.i, b = +inp.dataset.b;
        st.ans[n][b] = inp.value;
        // editing a previously flagged blank clears its red mark; item stays unchecked until re-check
        if(st.bl[n][b] === false){ st.bl[n][b] = null; inp.classList.remove('gg-bad'); if(st.ok[n] === false){ st.ok[n] = null; item.classList.remove('gg-item-bad'); } }
        ggSave(topicId, level, st); updateProg();
      });
      inp.addEventListener('keydown', e => {
        if(e.key !== 'Enter') return;
        e.preventDefault();
        const all = Array.from(root.querySelectorAll('.gg-inp:not([readonly])'));
        const nxt = all[all.indexOf(inp) + 1];
        if(nxt) nxt.focus(); else inp.blur();
      });
    });
    root.querySelector('#ggCheck').addEventListener('click', () => {
      let score = 0;
      st.items.forEach((it, n) => {
        let all = true;
        it.a.forEach((acc, b) => { const r = ggBlankOk(st.ans[n][b], acc); st.bl[n][b] = r; if(!r) all = false; });
        st.ok[n] = all; if(all) score++;
      });
      st.checked = true; st.score = score; ggSave(topicId, level, st);
      if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
      applyResults();
      const firstBad = root.querySelector('.gg-item-bad');
      if(firstBad){ firstBad.style.scrollMarginTop = '90px'; firstBad.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    });
    root.querySelector('#ggAgain').addEventListener('click', () => {
      if(!st.checked && ggFilled(st) > 0 && !confirm('Reset? This gives you a new set and your current answers will be lost.')) return;
      st = ggDraw(topic, level, st.idx); ggSave(topicId, level, st);
      render(true);
    });
  }
  render(false);
}

var TILE_HEX = '#85389F';
function ggTileStyle(){ return { tint: ' style="background:' + hexToRgba(TILE_HEX, 0.14) + '"', ico: ' style="color:var(--f-des)"' }; }
var app = document.getElementById('app');
function fail(){ app.innerHTML = '<a class="back-link" href="index.html">\u2190 Back to Mr Eric\'s Lounge</a><div class="empty-card" style="margin-top:14px;">Could not load the exercises. Check your connection and reload.</div>'; }
function showTopics(){
  document.title = "Grammar Practice \u2014 Mr Eric's Lounge";
  app.innerHTML = '<a class="back-link" href="index.html">\u2190 Back to Mr Eric\'s Lounge</a>' +
    '<section style="padding-top:14px;"><div class="section-head"><span class="emoji">' + icon('book') + '</span><h2>Grammar Practice</h2></div>' +
    '<div class="ivb-search-wrap"><span class="ivb-search-icon">' + icon('search') + '</span>' +
    '<input type="text" id="ggSearch" class="search-input" placeholder="Search a topic\u2026" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
    '<div class="sport-hub-grid" id="ggGrid"><div class="empty-card" style="grid-column:1/-1;">Loading\u2026</div></div></section>';
  var bl = app.querySelector('.back-link'); if(bl) bl.addEventListener('click', backToLounge);
  loadIndex().then(function(ix){
    var grid = document.getElementById('ggGrid'), input = document.getElementById('ggSearch');
    if(!grid) return;
    var st = ggTileStyle();
    grid.innerHTML = ix.topics.map(function(t){
      var busy = false;
      GG_LEVELS.forEach(function(l){ var s = ggLoad(t.id, l.key); if(s && !s.checked && ggFilled(s) > 0) busy = true; });
      return '<a class="sport-hub-tile gg-tile" href="#' + t.id + '" data-name="' + escapeHtml(t.name.toLowerCase()) + '"' + st.tint + '>' +
        '<span class="name"><span class="hub-icon"' + st.ico + '>' + icon('book') + '</span> ' + escapeHtml(t.name) + (busy ? ' <span class="gg-dot" title="In progress"></span>' : '') + '</span></a>';
    }).join('') + '<div class="empty-card" id="ggNone" style="grid-column:1/-1;display:none;">No topic matches.</div>';
    input.addEventListener('input', function(){
      var words = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
      Array.prototype.forEach.call(grid.querySelectorAll('.gg-tile'), function(a){
        var ok = words.every(function(w){ return a.dataset.name.indexOf(w) !== -1; });
        a.style.display = ok ? '' : 'none'; if(ok) shown++;
      });
      document.getElementById('ggNone').style.display = shown ? 'none' : '';
    });
  }).catch(fail);
}
function showLevels(topicId){
  app.innerHTML = '<a class="back-link" href="#">\u2190 Back to Grammar Practice</a><section style="padding-top:14px;"><div class="section-head"><span class="emoji">' + icon('book') + '</span><h2 id="ggLevelsTitle">Loading\u2026</h2></div><div class="sport-hub-grid gg-levels" id="ggLevels"></div></section>';
  loadIndex().then(function(ix){
    var topic = ix.topics.filter(function(t){ return t.id === topicId; })[0];
    var box = document.getElementById('ggLevels'); if(!box) return;
    if(!topic){ box.innerHTML = '<div class="empty-card">Topic not found.</div>'; return; }
    document.title = topic.name + " \u2014 Grammar Practice";
    document.getElementById('ggLevelsTitle').textContent = topic.name;
    var st = ggTileStyle();
    box.innerHTML = GG_LEVELS.map(function(l){
      var s = ggLoad(topicId, l.key), status = 'Not started';
      if(s){
        if(s.checked && s.score != null) status = (s.score === GG_PER_SET ? 'Last score: 20/20 \u2713' : 'Last score: ' + s.score + '/' + GG_PER_SET);
        else if(ggFilled(s) > 0) status = 'In progress \u00b7 ' + ggFilled(s) + '/' + GG_PER_SET + ' answered';
      }
      return '<a class="sport-hub-tile gg-level" href="#' + topicId + '/' + l.key + '"' + st.tint + '><span class="name" style="flex-direction:column;gap:3px;"><span>' + l.label + '</span><span class="gg-sub">' + escapeHtml(status) + '</span></span></a>';
    }).join('');
  }).catch(fail);
}
function showExercise(topicId, level){
  app.innerHTML = '<a class="back-link" href="#' + escapeHtml(topicId) + '">\u2190 Back to levels</a><section style="padding-top:14px;" id="ggExercise"><div class="section-head"><span class="emoji">' + icon('book') + '</span><h2>Loading\u2026</h2></div><div class="empty-card">Loading\u2026</div></section>';
  Promise.all([loadTopic(topicId), loadPools()]).then(function(r){
    var topic = r[0]; POOLS = r[1];
    if(!document.getElementById('ggExercise')) return;
    document.title = topic.name + " \u2014 Grammar Practice";
    ggWireExercise(app, { topics:[topic] }, topicId, level);
  }).catch(function(){ fail(); });
}
var depth = 0, lastD = -1;
function noteDepth(){
  var s = history.state;
  if(s && typeof s.d === 'number') depth = s.d; else { depth = lastD + 1; try{ history.replaceState({ d: depth }, ''); }catch(e){} }
  lastD = depth;
}
// "Back to Mr Eric's Lounge": if we came from the app, rewind history so the browser restores the
// already-loaded home page instantly (no 2 MB reload); otherwise just open it.
function backToLounge(e){
  var ok = false;
  try{ var u = new URL(document.referrer); ok = u.origin === location.origin && !/grammar\.html$/.test(u.pathname) && history.length > depth + 1; }catch(x){}
  if(!ok) return;
  e.preventDefault();
  history.go(-(depth + 1));
  setTimeout(function(){ location.href = 'index.html'; }, 1200);
}
function route(){
  noteDepth();
  var parts = location.hash.replace(/^#/, '').split('/').filter(Boolean).map(decodeURIComponent);
  window.scrollTo(0, 0);
  if(parts[1]) showExercise(parts[0], parts[1]);
  else if(parts[0]) showLevels(parts[0]);
  else showTopics();
}
window.addEventListener('hashchange', route);
route();

})();
