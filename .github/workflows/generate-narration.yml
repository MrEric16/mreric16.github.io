name: Generate voice narration (manual, reviewed-script only)

# Manual-only on purpose. Narration scripts are reviewed and approved by
# Mr Eric before they're ever recorded (standing rule, not yet automatic).
# This workflow never runs on a schedule -- it only runs when explicitly
# dispatched with the slug of an already-approved script sitting in
# scripts/narration_scripts/<slug>.txt.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Narration slug (matches scripts/narration_scripts/<slug>.txt)'
        required: true
        type: string
      voice_id:
        description: 'Voice ID. Default is the ElevenLabs voice Mr Eric chose on 2026-10-05 (eleven3). Only override to test another voice.'
        required: true
        default: 'vA86gNSOveXJlcH1HsHW'
        type: string
      provider:
        description: 'TTS provider'
        required: true
        default: 'elevenlabs'
        type: choice
        options:
          - elevenlabs
          - smallest
      model:
        description: 'Optional model override (blank = provider default; ElevenLabs default eleven_multilingual_v2)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnose -- list voices and their language/model tags
        if: ${{ inputs.provider == 'smallest' }}
        env:
          SMALLEST_AI_API_KEY: ${{ secrets.SMALLEST_AI_API_KEY }}
        run: |
          echo "--- my cloned voices (GET /waves/v1/voice-cloning) ---" > scripts/narration-voices-debug.txt
          curl -s -H "Authorization: Bearer $SMALLEST_AI_API_KEY" "https://api.smallest.ai/waves/v1/voice-cloning" >> scripts/narration-voices-debug.txt
          echo "" >> scripts/narration-voices-debug.txt
          cat scripts/narration-voices-debug.txt

      - name: Generate narration audio
        env:
          SMALLEST_AI_API_KEY: ${{ secrets.SMALLEST_AI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MODEL_OVERRIDE: ${{ inputs.model }}
        run: |
          EXTRA=""
          [ -n "$MODEL_OVERRIDE" ] && EXTRA="--model $MODEL_OVERRIDE"
          python3 scripts/generate_voice_narration.py \
            --provider "${{ inputs.provider }}" \
            --slug "${{ inputs.slug }}" \
            --voice-id "${{ inputs.voice_id }}" \
            $EXTRA \
            > scripts/narration-log.txt 2>&1 || echo "GENERATE_FAILED_SEE_LOG" >> scripts/narration-log.txt
          cat scripts/narration-log.txt

      - name: Commit audio and log
        if: always()
        run: |
          git config user.name "narration-bot"
          git config user.email "actions@github.com"
          git add scripts/narration-log.txt || true
          [ -f scripts/narration-voices-debug.txt ] && git add scripts/narration-voices-debug.txt || true
          [ -f "data/audio/${{ inputs.slug }}.mp3" ] && git add "data/audio/${{ inputs.slug }}.mp3" || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Narration run: ${{ inputs.slug }}"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main -q && git push -q && break
            echo "push attempt $i lost a race, retrying"; sleep 4
          done

      - name: Fail the job if generation failed
        run: |
          if grep -q "GENERATE_FAILED_SEE_LOG" scripts/narration-log.txt; then
            echo "Generation failed, see scripts/narration-log.txt"
            exit 1
          fi

      - name: Trigger Pages redeploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
