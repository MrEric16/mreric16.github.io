name: Tests
on:
  push:
    branches: ["main"]
    paths: ["index.html", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.js
