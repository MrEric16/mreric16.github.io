name: Fetch Tashkent today data (rates, air, prayer)
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tashkent-today-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Fetch and validate
        shell: bash
        run: python scripts/fetch_tashkent_today.py 2>&1 | tee scripts/tashkent-today-log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tashkent-today.json scripts/tashkent-today-log.txt
          git commit -m "Update Tashkent today data" || exit 0
          git pull -q --rebase
          git push
