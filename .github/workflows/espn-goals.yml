name: Fetch ESPN goal detail (scorers + minutes + HT)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch
        run: python scripts/fetch_espn_goals.py > scripts/espn-last-run-log.txt 2>&1 || echo "FETCH_FAILED" >> scripts/espn-last-run-log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "espn-goals-bot"
          git config user.email "actions@github.com"
          git add scripts/espn-last-run-log.txt || true
          git add data/espn-goals.json || true
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update ESPN goal detail"
          git pull --rebase --autostash origin main || true
          git push
      - name: Trigger Pages redeploy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
