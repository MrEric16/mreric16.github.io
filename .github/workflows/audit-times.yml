name: Audit kick-off times
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare football-full.json kick-offs with BBC Sport (independent source)
        run: python scripts/audit_times_bbc.py --days 60
