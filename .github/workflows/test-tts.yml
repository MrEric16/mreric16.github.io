name: Test release audio URL
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          U=https://github.com/MrEric16/mreric16.github.io/releases/download/lp-20261020/202610202025-S1001.mp3
          {
          curl -sIL -m 30 -H "Origin: https://mreric16.github.io" "$U" | grep -i -E "^(HTTP|location|content-type|access-control|vary)"
          echo ---range
          curl -s -L -m 30 -H "Range: bytes=0-99" -o /dev/null -D - "$U" | grep -i -E "^(HTTP|content-range|content-type)"
          } > scripts/tts-test-log.txt 2>&1
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/tts-test-log.txt; git commit -m "audio url probe" ; git pull -q --rebase; git push
