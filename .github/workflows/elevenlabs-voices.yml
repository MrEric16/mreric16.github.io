name: List ElevenLabs voices (diagnostic, manual)

# Lists the voices on the account behind the ELEVENLABS_API_KEY secret
# (name, voice_id, category, settings). Writes scripts/elevenlabs-voices.txt.
# Never prints the key.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: List voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - > scripts/elevenlabs-voices.txt 2>&1 <<'PY' || true
          import json, os, urllib.request, urllib.error
          def get(url):
              req = urllib.request.Request(url, headers={"xi-api-key": os.environ["ELEVENLABS_API_KEY"]})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": e.code, "body": e.read().decode()[:300]}
          d = get("https://api.elevenlabs.io/v2/voices?page_size=100&include_total_count=true")
          if "error" in d:
              d = get("https://api.elevenlabs.io/v1/voices")
          if "error" in d: print("ERROR", d); raise SystemExit
          for v in d.get("voices", []):
              print(f'{v.get("voice_id")} | {v.get("name")} | category={v.get("category")} | created={v.get("created_at_unix")} | labels={v.get("labels")}')
          print("TOTAL", len(d.get("voices", [])))
          t = get("https://api.elevenlabs.io/v1/voices/hpp4J3VqNfWAUOO0d1Us")
          print("\n--- the ID you gave me ---")
          print(json.dumps({k: t.get(k) for k in ("voice_id","name","category","description","labels","settings","error","body")}, indent=1))
          PY
          cat scripts/elevenlabs-voices.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "voice-diag-bot"; git config user.email "actions@github.com"
          git add scripts/elevenlabs-voices.txt || true
          git diff --cached --quiet && echo "nothing" || git commit -q -m "ElevenLabs voice list"
          for i in 1 2 3; do git pull --rebase --autostash origin main -q && git push -q && break; sleep 3; done
