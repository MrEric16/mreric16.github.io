name: Generate listening audio (neural voices)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install edge-tts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python scripts/gen_listening_audio.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audio/listening
          git commit -m "Generate listening audio" || exit 0
          git pull -q --rebase
          git push
