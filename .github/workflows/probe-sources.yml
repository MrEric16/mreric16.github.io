name: Probe sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p probe; cd probe
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://muslim.uz/build/js/scripts.min.js" -o s.js || true
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://muslim.uz/uz" -o home.html || true
          wc -c s.js home.html > sizes.txt
          grep -o -E ".{120}(namaz|namoz|prayer|prayers|vaqt)[^;]{0,200}" s.js | head -20 > js_hits.txt || true
          grep -o -E "(url|href|action)[^,;]{0,12}['\"][^'\"]*(prayer|namaz|namoz|time|vaqt)[^'\"]*['\"]" s.js | head > urls.txt || true
          grep -n -i "prayer\|namaz\|vaqt" home.html | head -40 | cut -c1-260 > home_hits.txt || true
          cp home.html home_full.html; grep -o -E ".{80}(Peshin|Xufton|prayer-times|namaz-vaqt|getPrayer|pray)[^;]{0,160}" s.js | head -10 > js2.txt || true; rm -f s.js home.html
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A probe; git commit -m "probe4" ; git pull -q --rebase; git push
