name: Probe sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p probe; cd probe
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://muslim.uz/uz/pages/namoz-vaqtlari" -o m.html || true
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://muslim.uz/ru/pages/namoz-vaqtlari" -o mr.html || true
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://islomapi.uz/api/monthly?region=Toshkent&month=10" -o i.json || true
          curl -sS -m 40 -L -A "Mozilla/5.0" "https://islom.uz/" -o islom.html || true
          wc -c * > sizes.txt
          grep -o 'href="[^"]*[Nn]amoz[^"]*"' m.html | sort -u | head -30 > links.txt || true
          grep -n -i "toshkent\|тошкент\|ташкент" m.html | head -20 | cut -c1-300 > tk.txt || true
          grep -n -E "[0-9]{2}:[0-9]{2}" m.html | head -40 | cut -c1-300 > times.txt || true
          rm -f m.html mr.html islom.html
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A probe; git commit -m "probe2" ; git pull -q --rebase; git push
