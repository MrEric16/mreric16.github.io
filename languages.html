<style>

  :root{
    --cream:#F3EADD; --cream-2:#E9D9C5; --card:#FBF5EA; --ink:#3D2A22; --ink-soft:#6A5644;
    --coral:#7A2E35; --coral-dark:#5C2530; --teal:#6B7A3D; --gold:#B5862B; --line:#E0CBA4;
    --ff-accent:var(--coral-dark); --f-des:#85389F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;}
  h1,h2,h3{font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin:0;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:18px 16px 48px;}
  .section-head{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .section-head h2{min-width:0; font-size:22px; color:var(--ink);}
  .section-head .emoji{display:inline-flex; align-items:center;} .section-head .emoji svg{width:22px;height:22px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; color:var(--ff-accent); text-decoration:none; cursor:pointer; margin-bottom:6px;}
  .back-link:hover{text-decoration:underline;}
  .sport-hub-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .sport-hub-tile{background:var(--card); border:none; border-radius:18px; box-shadow:0 3px 0 rgba(58,42,30,.08); font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-decoration:none; color:var(--ink); height:100px; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; -webkit-tap-highlight-color:transparent;}
  .sport-hub-tile:active{transform:translateY(1px);}
  .gg-tile{position:relative; padding-top:20px;}
  .gg-no{position:absolute; top:7px; left:9px; min-width:1.6em; padding:0 6px; border-radius:999px; background:rgba(133,56,159,.16); color:#85389F; font-size:11px; font-weight:800; line-height:1.6; text-align:center;}
  body.dark-mode .gg-no{color:#d9a8ec; background:rgba(217,168,236,.16);}
  .sport-hub-tile .name{font-weight:700; font-size:15px; line-height:1.25; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;}
  .hub-icon{display:inline-flex; align-items:center; justify-content:center;}
  .hub-icon svg{width:20px;height:20px;}
  .search-input{width:100%; padding:14px 16px; border-radius:16px; border:none; background:var(--card); color:var(--ink); font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:16px; box-shadow:0 3px 0 rgba(58,42,30,.08);}
  .search-input:focus{outline:2px solid var(--coral);}
  .ivb-search-wrap{position:relative; margin-bottom:12px;}
  .ivb-search-wrap .search-input{padding-left:42px;}
  .ivb-search-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; opacity:.55; pointer-events:none;}
  .empty-card{background:var(--card); border-radius:18px; padding:34px 20px; text-align:center; color:var(--ink-soft); font-weight:600; font-size:14px;}
  @media (min-width:560px){ .sport-hub-grid:not(.gg-levels){grid-template-columns:repeat(3,1fr);} }

  /* - Grammar Gym (Brain Train style tiles + typed exercise list) - */
  .gg-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--coral); margin-left:4px; vertical-align:middle;}
  .gg-levels{grid-template-columns:1fr;}
  .gg-sub{font-weight:600; font-size:12px; color:var(--ink-soft);}
  .gg-meta{display:flex; justify-content:space-between; align-items:center; margin:2px 2px 12px; font-size:13px; font-weight:700; color:var(--ink-soft);}
  .gg-lvl{background:var(--coral); color:#fff; border-radius:999px; padding:3px 12px; font-size:12px; font-weight:800;}
  .gg-banner{border-radius:14px; padding:12px 14px; margin-bottom:12px; font-weight:800; font-size:15px;}
  .gg-banner-ok{background:rgba(107,122,61,.22); color:var(--ink);}
  .gg-banner-mid{background:rgba(179,38,30,.14); color:var(--ink);}
  .gg-list{display:flex; flex-direction:column; gap:10px;}
  .gg-item{background:var(--card); border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; box-shadow:0 2px 0 rgba(58,42,30,.08); border:2px solid transparent;}
  .gg-item-ok{border-color:var(--teal);}
  .gg-item-bad{border-color:#B3261E;}
  .gg-num{font-weight:800; color:var(--ink-soft); min-width:22px; padding-top:5px; font-size:14px;}
  .gg-q{flex:1; min-width:0; line-height:2.2; font-size:16px; color:var(--ink);}
  .gg-q-block{line-height:1.5;}
  .gg-instr{font-weight:400; color:var(--ink); font-size:15px;}
  .gg-sent{font-weight:800; font-size:17px; letter-spacing:.15px; color:var(--gg-sent, var(--ink));}
  .gg-inp{font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size:16px; width:11em; max-width:100%; padding:4px 9px; margin:0 3px; border-radius:9px; border:2px solid rgba(133,111,92,.4); background:rgba(255,255,255,.55); color:var(--ink);}
  .gg-inp:focus{outline:2px solid var(--coral); border-color:var(--coral);}
  .gg-wide{display:block; width:100%; margin:8px 0 0;}
  .gg-inp.gg-ok{border-color:var(--teal); background:rgba(107,122,61,.18);}
  .gg-inp.gg-bad{border-color:#B3261E; background:rgba(179,38,30,.12);}
  body.dark-mode .gg-inp{background:rgba(0,0,0,.25);}
  body.dark-mode .gg-item-bad, body.dark-mode .gg-inp.gg-bad{border-color:#E57373;}
  .gg-actions{display:flex; gap:10px; margin:16px 0 28px;}
  .gg-btn{flex:1; border:none; border-radius:16px; padding:15px 12px; font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight:800; font-size:16px; cursor:pointer; background:var(--card); color:var(--ink); box-shadow:0 3px 0 rgba(58,42,30,.12);}
  .gg-btn-main{background:var(--coral); color:#fff;}

  /* - IELTS Vocabulary - */
  .v-sub{color:var(--ink-soft); font-weight:600; font-size:13px; margin:-8px 0 14px;}
  .v-filters{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 16px;}
  .v-filters label{font-weight:800; font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;}
  .v-sel{width:100%; padding:12px; border-radius:14px; border:none; background:var(--card); color:var(--ink); font-family:inherit; font-size:15px; font-weight:700;}
  .v-card{background:var(--card); border-radius:20px; padding:22px 18px; box-shadow:0 3px 0 rgba(58,42,30,.08); margin-bottom:14px; text-align:center;}
  .v-word{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:30px; line-height:1.15; color:var(--ink); overflow-wrap:anywhere;}
  .v-pos{display:inline-block; margin:6px 0 0; padding:2px 10px; border-radius:999px; background:rgba(133,56,159,.16); color:#85389F; font-size:12px; font-weight:800;}
  body.dark-mode .v-pos{color:#d9a8ec; background:rgba(217,168,236,.16);}
  .v-def{font-size:18px; font-weight:700; line-height:1.4; margin-top:14px; color:var(--ink);}
  .v-ex{font-size:15px; font-style:italic; color:var(--ink-soft); margin-top:10px; line-height:1.4;}
  .v-meta{display:flex; justify-content:space-between; font-weight:800; font-size:13px; color:var(--ink-soft); margin:0 2px 10px;}
  .v-bar{height:6px; border-radius:99px; background:var(--cream-2); overflow:hidden; margin-bottom:14px;}
  .v-bar>i{display:block; height:100%; background:var(--coral); width:0;}
  .v-opts{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .v-opt{border:2px solid transparent; background:var(--card); color:var(--ink); border-radius:16px; padding:14px 14px; font-family:inherit; font-size:16px; font-weight:700; text-align:left; cursor:pointer; box-shadow:0 2px 0 rgba(58,42,30,.08); line-height:1.3;}
  .v-opt:active{transform:translateY(1px);}
  .v-opt.ok{border-color:var(--teal); background:rgba(107,122,61,.25);}
  .v-opt.bad{border-color:#B3261E; background:rgba(179,38,30,.15);}
  .v-opts.six{display:grid; grid-template-columns:1fr 1fr;}
  .v-opts.six .v-opt{text-align:center; padding:14px 8px; overflow-wrap:anywhere;}
  .v-btn{width:100%; border:none; border-radius:16px; padding:15px 12px; font-family:inherit; font-weight:800; font-size:16px; cursor:pointer; background:var(--coral); color:#fff; margin-top:4px;}
  .v-btn.alt{background:var(--card); color:var(--ink); box-shadow:0 2px 0 rgba(58,42,30,.08);}
  .v-row{display:flex; gap:10px;}
  .v-row .v-btn{flex:1;}
  .v-save{border:none; background:transparent; color:var(--ff-accent); font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; padding:8px 4px;}
  .v-save.on{color:var(--teal);}
  .blur{filter:blur(9px); cursor:pointer; user-select:none; -webkit-user-select:none; transition:filter .2s; display:inline-block; max-width:100%;}
  .blur.show{filter:none; user-select:text; -webkit-user-select:text;}
  .v-hint{font-size:12px; font-weight:700; color:var(--ink-soft); margin:2px 2px 12px;}
  .v-big{font-family:'Baloo 2', sans-serif; font-size:44px; font-weight:700; color:var(--coral);}
  .v-miss{background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px; text-align:left;}
  .v-miss b{font-size:16px;} .v-miss div{font-size:14px; color:var(--ink-soft); margin-top:3px;}
  .v-learn{height:360px; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; padding:20px 18px 52px; overflow:auto;}
  .v-learn .v-save{position:absolute; bottom:8px; left:50%; transform:translateX(-50%);}
  .v-fixed{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); width:min(688px, calc(100% - 32px)); margin:0; z-index:5;}
</style>

<script>
// Applies whatever theme/dark-mode the main app currently has active, read straight
// from the same-origin localStorage key it writes to. Mirrors applyThemeState() and
// applySeasonalTheme() in index.html exactly (including the "no explicit choice yet
// -> fall back to the date-driven seasonal theme" case), minus the bits that don't
// apply to this page (persisting, the toggle icon, the title-color DOM hack, National
// Day's one-time fireworks/centering - none of them have anything to act on here).
// Runs synchronously before any content below is parsed, so there's no flash of the
// wrong theme.
(function(){
  function tashkentEffectiveDay(){
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tashkent', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hour12:false
    }).formatToParts(new Date());
    function get(t){ for(var i=0;i<parts.length;i++){ if(parts[i].type===t) return parts[i].value; } }
    var y = +get('year'), mo = +get('month'), d = +get('day'), h = +get('hour');
    var dayObj = new Date(Date.UTC(y, mo-1, d));
    if(h < 4){ dayObj.setUTCDate(dayObj.getUTCDate() - 1); }
    return dayObj.toISOString().slice(0,10);
  }
  var SEASONAL_THEMES = [
    { key:'firstday',  start:'2026-08-29', end:'2026-08-31' },
    { key:'christmas', start:'2026-12-24', end:'2026-12-26' },
    { key:'newyear',   start:'2026-12-31', end:'2027-01-02' },
    { key:'ramadan',   start:'2027-02-08', end:'2027-03-09' },
    { key:'eidfitr',   start:'2027-03-10', end:'2027-03-12' },
    { key:'nowruz',    start:'2027-03-20', end:'2027-03-22' },
    { key:'eidadha',   start:'2027-05-15', end:'2027-05-17' },
  ];
  var USER_THEME_KEYS = ['ihl','arsenal','arsenal2','uzbekistan2','soviet','bazaar','hacker','nebula','synthwave','bauhaus','vintage','d1','dihl','darsenal','dvintage','dhalloween'];
  var body = document.body;
  var key = null;
  try{ key = localStorage.getItem('themeChoice'); }catch(e){}
  try{ if(Date.now() < Date.UTC(2026, 10, 1, 1, 0, 0) && sessionStorage.getItem('hwOff') !== '1') key = 'dhalloween'; }catch(e){}   // HALLOWEEN 2026
  if(key === null){
    var today = tashkentEffectiveDay();
    var active = null;
    for(var i=0;i<SEASONAL_THEMES.length;i++){
      var t = SEASONAL_THEMES[i];
      if(today >= t.start && today <= t.end){ active = t; break; }
    }
    if(active) body.classList.add('theme-' + active.key);
    return;
  }
  if(key !== 'default' && key !== 'nationalday' && USER_THEME_KEYS.indexOf(key) === -1){
    key = 'default';
  }
  var isDark = key !== 'default' && key !== 'nationalday' && key.charAt(0) === 'd';
  if(isDark) body.classList.add('dark-mode');
  if(key === 'nationalday'){
    body.classList.add('theme-nationalday');
  } else if(key !== 'default'){
    body.classList.add('usertheme-' + key);
  }
})();
</script>
<div class="wrap" id="app"><div class="empty-card">Loading…</div></div>
<script>
(function(){
var app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function getJson(u){ return fetch(u, { cache: 'no-cache' }).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
function award(n, why){ if(window.LoungeXP) LoungeXP.award(n, why); }
function back(href, text){ return '<a class="back-link" href="' + href + '">← ' + esc(text) + '</a>'; }
function head(title, sub){ return '<div class="section-head" style="margin-top:8px;"><h2>' + esc(title) + '</h2></div>' + (sub ? '<div class="v-sub">' + esc(sub) + '</div>' : ''); }
function headF(title, f){ return '<div class="section-head" style="margin-top:8px;"><h2 style="display:flex;align-items:center;gap:10px;">' + flag(f) + esc(title) + '</h2></div>'; }
function hash32(s){ var h = 5381; for(var i=0;i<s.length;i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }

var HUB_BACK = back('index.html#geography-hub/study', 'Back to Train Your Brain');
var SECS = [['sounds','Sounds'],['numbers','Numbers'],['greetings','Greetings'],['phrases','Phrases'],['vocab','Vocabulary'],['grammar','Grammar'],['test','Test']];
var INDEX = null, cache = {}, quizDir = 'mix';

/* ---- progress: lang_<id> = { itemHash: box 0..5 }, merged across devices by max ---- */
function prog(id){ return lsGet('lang_' + id, {}); }
function setBox(id, k, b){ var p = prog(id); p[k] = b; lsSet('lang_' + id, p); if(window.LoungeSync && LoungeSync.markDirty) LoungeSync.markDirty(); }

/* ---- flatten a language into items: {k,en,t,s,sec,gid} ---- */
function build(L){
  if(L._b) return L; L._b = true; L.items = []; L.groups = {};
  function addGroup(sec, g){
    var gid = sec + '.' + g.id, list = [];
    (g.items || []).forEach(function(it){ var o = { en: it[0], t: it[1], s: it[2] || '', sc: it[3] || '', sec: sec, gid: gid, k: hash32(sec + '|' + it[0] + '|' + it[1]) }; list.push(o); L.items.push(o); });
    L.groups[gid] = { id: g.id, gid: gid, sec: sec, title: g.title, items: list, note: g.note || '' };
  }
  ['numbers','greetings','phrases','vocab'].forEach(function(sec){ (L[sec] || []).forEach(function(g){ addGroup(sec, g); }); });
  (L.grammar || []).forEach(function(les){ if(les.ex && les.ex.length) addGroup('grammar', { id: les.id, title: les.title, items: les.ex }); });
  return L;
}
function secGroups(L, sec){
  if(sec === 'grammar') return (L.grammar || []).map(function(l){ return { id: l.id, title: l.title, gid: 'grammar.' + l.id }; });
  return (L[sec] || []).map(function(g){ return { id: g.id, title: g.title, gid: sec + '.' + g.id }; });
}
function counts(L, items){ var p = prog(L.id), n = 0; items.forEach(function(it){ if((p[it.k] || 0) >= 3) n++; }); return n; }

function loadLang(id){
  if(cache[id]) return Promise.resolve(cache[id]);
  return getJson('data/lang/' + id + '.json').then(function(L){ L.id = id; cache[id] = build(L); return cache[id]; });
}
function flag(f){ return f ? '<img class="lg-flag" src="data/lang/flags/' + esc(f) + '.svg" alt="" width="30" height="20">' : ''; }
function tile(href, title, sub, fl){
  return '<a class="sport-hub-tile" href="' + href + '"><span class="name" style="' + (fl ? 'flex-direction:row;align-items:center;gap:10px;' : 'flex-direction:column;gap:2px;') + '">' + flag(fl) + '<span style="display:flex;flex-direction:column;gap:2px;"><span>' + esc(title) + '</span>' + (sub ? '<span style="font-size:12px;color:var(--ink-soft);font-weight:700;">' + esc(sub) + '</span>' : '') + '</span></span></a>';
}
function flagOf(id){ var r = INDEX.filter(function(x){ return x.id === id; })[0]; return r ? r.flag : ''; }
function disp(o){ return o.t + (o.sc ? '\n' + o.sc : ''); }
function bar(p){ return '<div class="v-bar"><i style="width:' + Math.round(p) + '%"></i></div>'; }

/* ---- views ---- */
function hub(){
  var p = lsGet('xp.dev', null);
  app.innerHTML = HUB_BACK + head('Learn a Language') + '<div class="sport-hub-grid">' + INDEX.map(function(x){
    var pr = prog(x.id), n = 0; for(var k in pr){ if(pr[k] >= 3) n++; }
    return tile('#l/' + x.id, x.name, (n ? Math.min(100, Math.round(n * 100 / x.count)) + '%' : ''), x.flag);
  }).join('') + '</div>';
}
function home(L){
  var learned = counts(L, L.items);
  app.innerHTML = back('#', 'Back to languages') + headF(L.name, flagOf(L.id)) +
    '<div class="v-meta"><span>' + learned + ' / ' + L.items.length + ' learned</span></div>' + bar(L.items.length ? learned * 100 / L.items.length : 0) +
    '<div class="sport-hub-grid">' + SECS.filter(function(s){
      if(s[0] === 'sounds') return L.sounds; if(s[0] === 'test') return L.items.length; return (L[s[0]] || []).length; }).map(function(s){
      var sub = ''; if(s[0] !== 'sounds' && s[0] !== 'test'){ var its = []; secGroups(L, s[0]).forEach(function(g){ if(L.groups[g.gid]) its = its.concat(L.groups[g.gid].items); }); if(its.length) sub = counts(L, its) + ' / ' + its.length; }
      return tile('#l/' + L.id + '/' + s[0], s[1], sub); }).join('') + '</div>';
}
function sounds(L){
  var S = L.sounds;
  app.innerHTML = back('#l/' + L.id, L.name) + head('Sounds', S.intro || '') +
    '<div class="lg-tbl">' + (S.rows || []).map(function(r){ return '<div class="lg-row"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + (r[2] ? '<i> ' + esc(r[2]) + '</i>' : '') + '</span></div>'; }).join('') + '</div>' +
    (S.notes ? '<div class="v-hint" style="margin-top:12px;">' + S.notes.map(esc).join('<br>') + '</div>' : '');
}
function section(L, sec){
  var title = SECS.filter(function(s){ return s[0] === sec; })[0][1];
  if(sec === 'sounds') return sounds(L);
  if(sec === 'test') return testPicker(L);
  var gs = secGroups(L, sec);
  if(gs.length === 1 && sec !== 'grammar') return group(L, sec, gs[0].id, true);
  app.innerHTML = back('#l/' + L.id, L.name) + head(title) + '<div class="sport-hub-grid">' + gs.map(function(g){
    var G = L.groups[g.gid], sub = G ? counts(L, G.items) + ' / ' + G.items.length : '';
    return tile('#l/' + L.id + '/' + sec + '/' + g.id, g.title, sub); }).join('') + '</div>';
}
function rowsHtml(items, p){
  return '<div class="lg-list">' + items.map(function(it){
    var ok = (p[it.k] || 0) >= 3;
    return '<div class="lg-it' + (ok ? ' on' : '') + '"><div class="lg-en">' + esc(it.en) + '</div><div class="lg-t">' + esc(it.t) + '</div>' + (it.sc ? '<div class="lg-sc">' + esc(it.sc) + '</div>' : '') + (it.s ? '<div class="lg-s">' + esc(it.s) + '</div>' : '') + '</div>'; }).join('') + '</div>';
}
function group(L, sec, gid, single){
  var G = L.groups[sec + '.' + gid]; if(!G) return home(L);
  var p = prog(L.id), n = counts(L, G.items);
  app.innerHTML = back(single ? '#l/' + L.id : '#l/' + L.id + '/' + sec, single ? L.name : SECS.filter(function(s){ return s[0] === sec; })[0][1]) + head(G.title) +
    (G.note ? '<div class="v-hint">' + esc(G.note) + '</div>' : '') + '<div class="v-meta"><span>' + n + ' / ' + G.items.length + ' learned</span></div>' + bar(n * 100 / G.items.length) +
    rowsHtml(G.items, p) + '<div class="v-row" style="margin-top:14px;"><button class="v-btn" id="qGo">Quiz this set</button></div>';
  document.getElementById('qGo').onclick = function(){ quiz(L, G.items, '#l/' + L.id + '/' + sec + (single ? '' : '/' + gid), G.title); };
}
function grammar(L, lid){
  var les = (L.grammar || []).filter(function(l){ return l.id === lid; })[0]; if(!les) return section(L, 'grammar');
  var G = L.groups['grammar.' + lid], p = prog(L.id);
  app.innerHTML = back('#l/' + L.id + '/grammar', 'Grammar') + head(les.title) +
    (les.text || []).map(function(t){ return '<div class="sp-card" style="padding:12px 14px;">' + esc(t) + '</div>'; }).join('') +
    (les.rows && les.rows.length ? '<div class="lg-tbl">' + les.rows.map(function(r){ return '<div class="lg-row"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + (r[2] ? '<i> ' + esc(r[2]) + '</i>' : '') + '</span></div>'; }).join('') + '</div>' : '') +
    (G ? '<div class="v-hint" style="margin-top:14px;">Examples</div>' + rowsHtml(G.items, p) + '<div class="v-row" style="margin-top:12px;"><button class="v-btn" id="qGo">Quiz these</button></div>' : '');
  if(G) document.getElementById('qGo').onclick = function(){ quiz(L, G.items, '#l/' + L.id + '/grammar/' + lid, les.title); };
}
function testPicker(L){
  var dirs = [['mix','Mixed'],['f','English → ' + L.name],['r',L.name + ' → English']];
  app.innerHTML = back('#l/' + L.id, L.name) + head('Test') +
    '<div class="v-row" style="margin-bottom:12px;flex-wrap:wrap;">' + dirs.map(function(d){ return '<button class="v-btn' + (quizDir === d[0] ? '' : ' alt') + '" data-d="' + d[0] + '" style="font-size:13px;padding:12px 6px;">' + esc(d[1]) + '</button>'; }).join('') + '</div>' +
    '<div class="sport-hub-grid">' + [['all','Everything']].concat(SECS.filter(function(s){ return ['numbers','greetings','phrases','vocab','grammar'].indexOf(s[0]) > -1 && L.items.some(function(i){ return i.sec === s[0]; }); })).map(function(s){
      return '<a class="sport-hub-tile" href="javascript:void(0)" data-p="' + s[0] + '"><span class="name">' + esc(s[1]) + '</span></a>'; }).join('') + '</div>';
  Array.prototype.forEach.call(app.querySelectorAll('[data-d]'), function(b){ b.onclick = function(){ quizDir = b.getAttribute('data-d'); testPicker(L); }; });
  Array.prototype.forEach.call(app.querySelectorAll('[data-p]'), function(a){ a.onclick = function(){
    var s = a.getAttribute('data-p'); var items = s === 'all' ? L.items : L.items.filter(function(i){ return i.sec === s; });
    quiz(L, items, '#l/' + L.id + '/test', 'Test'); }; });
}

/* ---- quiz: 10 multiple-choice questions, weakest items first ---- */
function pick(L, items, n){
  var p = prog(L.id);
  var scored = shuffle(items).map(function(it){ return { it: it, w: (p[it.k] || 0) + Math.random() * 1.6 }; });
  scored.sort(function(a, b){ return a.w - b.w; });
  return scored.slice(0, Math.min(n, scored.length)).map(function(x){ return x.it; });
}
function makeQ(L, it, pool){
  var f = quizDir === 'f' ? true : quizDir === 'r' ? false : Math.random() < .5;
  var prompt = f ? it.en : it.t, ans = f ? disp(it) : it.en, key = f ? 't' : 'en', pk = f ? 'en' : 't';
  var bad = {}; bad[f ? it.t : it.en] = 1;
  pool.forEach(function(o){ if(o[pk] === prompt) bad[o[key]] = 1; });
  function take(arr, out){ shuffle(arr).forEach(function(o){ if(out.length < 3 && !bad[o[key]]){ bad[o[key]] = 1; out.push(f ? disp(o) : o.en); } }); }
  var out = [];
  take(L.groups[it.gid].items, out);
  if(out.length < 3) take(L.items.filter(function(o){ return o.sec === it.sec; }), out);
  if(out.length < 3) take(L.items, out);
  return { it: it, f: f, prompt: prompt, ans: ans, hint: f ? '' : it.s, psc: f ? '' : it.sc, opts: shuffle(out.concat([ans])) };
}
function quiz(L, items, backHash, title){
  if(items.length < 4){ app.innerHTML = back(backHash, 'Back') + '<div class="v-hint">Not enough items.</div>'; return; }
  var qs = pick(L, items, 10).map(function(it){ return makeQ(L, it, L.items); });
  var i = 0, score = 0, xp = 0, missed = [];
  function show(){
    if(i >= qs.length) return end();
    var q = qs[i];
    app.innerHTML = back(backHash, 'Quit') + '<div class="v-meta"><span>' + esc(title) + '</span><span>' + (i + 1) + ' / ' + qs.length + '</span></div>' + bar(i * 100 / qs.length) +
      '<div class="v-card"><div class="v-pos">' + (q.f ? 'English → ' + esc(L.name) : esc(L.name) + ' → English') + '</div><div class="v-word" style="margin-top:12px;">' + esc(q.prompt) + '</div>' + (q.psc ? '<div class="v-word" style="margin-top:6px;">' + esc(q.psc) + '</div>' : '') + (q.hint ? '<div class="v-ex">' + esc(q.hint) + '</div>' : '') + '</div>' +
      '<div class="v-opts">' + q.opts.map(function(o, n){ return '<button class="v-opt lg-opt" data-n="' + n + '">' + esc(o) + '</button>'; }).join('') + '</div><div id="fb"></div>';
    var done = false;
    Array.prototype.forEach.call(app.querySelectorAll('.v-opt'), function(b){ b.onclick = function(){
      if(done) return; done = true;
      var o = q.opts[+b.getAttribute('data-n')], ok = o === q.ans, p = prog(L.id), box = p[q.it.k] || 0;
      if(ok){ score++; if(box < 5) xp++; setBox(L.id, q.it.k, Math.min(5, box + 1)); } else { missed.push(q.it); if(window.LoungeAmend) LoungeAmend.add(q.it.t + (q.it.sc ? ' ' + q.it.sc : ''), q.it.en + (q.it.s ? '  \u2022  ' + q.it.s : ''), L.name); setBox(L.id, q.it.k, Math.max(0, box - 1)); }
      Array.prototype.forEach.call(app.querySelectorAll('.v-opt'), function(x){ var v = q.opts[+x.getAttribute('data-n')]; if(v === q.ans) x.classList.add('ok'); else if(x === b) x.classList.add('bad'); });
      var show2 = q.f ? q.it.t + (q.it.sc ? '  \u2022  ' + q.it.sc : '') + (q.it.s ? '  •  ' + q.it.s : '') : q.it.en;
      document.getElementById('fb').innerHTML = '<div class="v-hint" style="font-size:14px;">' + (ok ? 'Correct. ' : 'Answer: ') + esc(show2) + '</div><button class="v-btn" id="nx">' + (i + 1 < qs.length ? 'Next' : 'Finish') + '</button>';
      document.getElementById('nx').onclick = function(){ i++; show(); };
    }; });
  }
  function end(){
    var bonus = score === qs.length ? 5 : 0; if(xp + bonus > 0) award(xp + bonus, 'language');
    app.innerHTML = back(backHash, 'Back') + head('Done') + '<div class="v-card"><div class="v-big">' + score + ' / ' + qs.length + '</div></div>' +
      (missed.length ? '<div class="v-hint">Missed</div>' + missed.map(function(m){ return '<div class="v-miss"><b>' + esc(m.t + (m.sc ? '  ' + m.sc : '')) + '</b><div>' + esc(m.en) + (m.s ? '  •  ' + esc(m.s) : '') + '</div></div>'; }).join('') : '') +
      '<div class="v-row" style="margin-top:12px;"><button class="v-btn" id="again">Again</button></div>';
    document.getElementById('again').onclick = function(){ quiz(L, items, backHash, title); };
  }
  show();
}

function route(){
  var h = location.hash.replace(/^#/, ''), a = h.split('/');
  if(a[0] !== 'l' || !a[1]) return hub();
  if(!INDEX.some(function(x){ return x.id === a[1]; })) return hub();
  loadLang(a[1]).then(function(L){
    if(!a[2]) return home(L);
    if(a[2] === 'grammar' && a[3]) return grammar(L, a[3]);
    if(a[3]) return group(L, a[2], a[3], false);
    section(L, a[2]);
  }).catch(function(){ app.innerHTML = back('#', 'Back') + '<div class="v-hint">Could not load. Check your connection.</div>'; });
}
window.addEventListener('hashchange', route);
getJson('data/lang/index.json').then(function(d){ INDEX = d; route(); }).catch(function(){ app.innerHTML = HUB_BACK + '<div class="v-hint">Could not load. Check your connection.</div>'; });
})();
</script>
