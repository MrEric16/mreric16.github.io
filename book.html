<style>

      var p = pinch; pinch = null;
      pagesEl.style.transform = ''; pagesEl.style.transformOrigin = ''; pagesEl.style.willChange = '';
      // content point under the pinch centre BEFORE the transform was applied equals the one under the fingers now
      var a = pos(p.cx, p.cy);
      var s0 = p.z0 / p.zNow;  // unused factor kept for clarity
      z = clamp(p.zNow, .5, 5); layout(); place(a); invalidate();
      lastTap = 0;
    }
  }
  scroller.addEventListener('touchend', function(e){
    if(pinch){ endPinch(e); return; }
    if(e.touches.length === 0 && e.changedTouches.length === 1){
      var t = e.changedTouches[0], now = Date.now();
      if(now - lastTap < 300 && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 30){
        e.preventDefault(); lastTap = 0;
        var sel = window.getSelection && window.getSelection(); if(sel) sel.removeAllRanges();
        setZoom(z > 1.4 ? 1 : 2.2, t.clientX, t.clientY);
      } else { lastTap = now; lastTapX = t.clientX; lastTapY = t.clientY; }
    }
  }, { passive: false });
  scroller.addEventListener('touchcancel', function(e){ if(pinch){ pinch = null; pagesEl.style.transform = ''; pagesEl.style.willChange = ''; } });

  /* ---------- jump ---------- */
  function goPage(n, offsetY){
    n = clamp(n, 1, N);
    scroller.scrollTop = PAD + (n - 1) * stride() + (offsetY || 0);
    update();
  }
  $('pgin').addEventListener('focus', function(){ this.select(); });
  $('pgin').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var v = this.value.trim().toLowerCase(), n;
      if(v === 'c' || v === 'cover') n = 1; else if(v === 't') n = 2; else if(/^[0-9]+$/.test(v)) n = toPdfPage(parseInt(v, 10)); else { setPageBox(); return; }
      goPage(n); this.blur();
    }
  });
  $('pgin').addEventListener('blur', setPageBox);

  /* ---------- sheet (contents / match list) ---------- */
  function openSheet(title, html){
    $('sheetT').textContent = title; $('sheetbody').innerHTML = html;
    $('sheet').classList.add('on'); $('scrim').classList.add('on');
  }
  function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
  $('sheetX').onclick = closeSheet; $('scrim').onclick = closeSheet;
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  $('bContents').onclick = function(){
    var h = CONTENTS.map(function(c){
      var pdfN = c[1] === 0 ? 1 : c[1] === -1 ? 2 : toPdfPage(c[1]);
      if(CFG.rich){ return '<button class="row' + (c[2] ? ' sec' : '') + '" data-n="' + toPdfPage(c[1]) + '" style="cursor:pointer"><b>' + (c[2] ? '' : 'p.' + c[1]) + '</b><span class="sn">' + esc(c[0]) + '</span></button>'; }
      return '<button class="row" data-n="' + pdfN + '"><b>' + (c[1] > 0 ? 'p.' + c[1] : '') + '</b><span class="sn">' + esc(c[0]) + '</span></button>';
    }).join('');
    if(CFG.rich) h = '<button class="row" data-n="1"><b></b><span class="sn">Cover</span></button><button class="row" data-n="2"><b></b><span class="sn">Contents</span></button>' + h;
    h += '<a class="row" style="text-decoration:none" href="' + PDF_URL + '" target="_blank" rel="noopener"><b></b><span class="sn">Open the original PDF</span></a>';
    openSheet('Contents', h);
  };
  $('sheetbody').addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.row[data-n], .row[data-h]'); if(!b) return;
    if(b.dataset.h !== undefined){ closeSheet(); goHit(parseInt(b.dataset.h, 10)); }
    else { closeSheet(); goPage(parseInt(b.dataset.n, 10)); }
  });

  /* ---------- text index + search ---------- */
  async function buildIndex(){
    for(var i = 1; i <= N; i++){
      try{
        var page = await pdf.getPage(i), tc = await page.getTextContent();
        var full = '', ranges = [];
        for(var j = 0; j < tc.items.length; j++){
          var it = tc.items[j]; if(typeof it.str !== 'string') continue;
          if(full.length) full += ' ';
          ranges.push({ s: full.length, e: full.length + it.str.length, it: it });
          full += it.str;
        }
        texts[i] = { full: full, low: full.toLowerCase(), ranges: ranges, tc: tc, h: page.view[3] - page.view[1] };
      }catch(e){ texts[i] = { full: '', low: '', ranges: [], h: H0 }; }
      indexed = i;
      if(i % 8 === 0){ if(query) runSearch(true); await new Promise(function(r){ setTimeout(r, 0); }); }
    }
    indexDone = true; if(query) runSearch(true);
  }
  function rectsFor(t, a, b){
    var out = [];
    for(var i = 0; i < t.ranges.length; i++){
      var r = t.ranges[i]; if(r.e <= a || r.s >= b) continue;
      var len = r.e - r.s; if(!len) continue;
      var s0 = Math.max(a, r.s) - r.s, e0 = Math.min(b, r.e) - r.s, it = r.it;
      var h = it.height || Math.abs(it.transform[3]) || 10;
      out.push({ x1: it.transform[4] + (s0 / len) * it.width, x2: it.transform[4] + (e0 / len) * it.width, ya: it.transform[5] - .22 * h, yb: it.transform[5] + .85 * h });
    }
    return out;
  }
  function runSearch(keepCur){
    var q = query.toLowerCase().replace(/\s+/g, ' ').trim(), prev = cur;
    var oldPages = {}; hits.forEach(function(h){ oldPages[h.page] = 1; });
    hits = [];
    if(q.length >= 2){
      for(var p = 1; p <= indexed; p++){
        var t = texts[p]; if(!t || !t.low) continue;
        var from = 0, idx;
        while((idx = t.low.indexOf(q, from)) !== -1){
          hits.push({ page: p, a: idx, b: idx + q.length, rects: rectsFor(t, idx, idx + q.length) });
          from = idx + q.length; if(hits.length > 2000) break;
        }
        if(hits.length > 2000) break;
      }
    }
    cur = hits.length ? (keepCur && prev >= 0 && prev < hits.length ? prev : -1) : -1;
    hits.forEach(function(h){ oldPages[h.page] = 1; });
    Object.keys(oldPages).forEach(function(p){ drawHL(+p); });
    countUI();
  }
  function countUI(){
    var s = $('scount');
    if(query.trim().length < 2){ s.textContent = indexDone ? '' : 'Indexing ' + Math.round(indexed / N * 100) + '%'; return; }
    if(!hits.length){ s.textContent = indexDone ? 'None' : 'Indexing ' + Math.round(indexed / N * 100) + '%'; return; }
    s.textContent = (cur >= 0 ? cur + 1 : '-') + ' / ' + hits.length + (hits.length > 2000 ? '+' : '') + (indexDone ? '' : '…');
  }
  function drawHL(n){
    var el = els[n - 1]; if(!el) return;
    var layer = el.querySelector('.hl'); if(layer) layer.remove();
    if(!el._key) return;
    var mine = [];
    for(var i = 0; i < hits.length; i++) if(hits[i].page === n) mine.push(i);
    if(!mine.length) return;
    layer = document.createElement('div'); layer.className = 'hl';
    var H = (texts[n] && texts[n].h) || H0;
    mine.forEach(function(i){
      hits[i].rects.forEach(function(r){
        var d = document.createElement('i'); if(i === cur) d.className = 'cur';
        d.style.left = (r.x1 * scale - 1) + 'px'; d.style.top = ((H - r.yb) * scale) + 'px';
        d.style.width = ((r.x2 - r.x1) * scale + 2) + 'px'; d.style.height = ((r.yb - r.ya) * scale) + 'px';
        layer.appendChild(d);
      });
    });
    el.appendChild(layer);
  }
  function goHit(i){
    if(!hits.length) return; i = (i + hits.length) % hits.length;
    var old = cur; cur = i; var h = hits[i], H = (texts[h.page] && texts[h.page].h) || H0;
    var r = h.rects[0], y = r ? (H - r.yb) * scale : 0;
    scroller.scrollTop = PAD + (h.page - 1) * stride() + y - scroller.clientHeight / 3;
    if(r){ var x = pageLeft() + r.x1 * scale; if(x < scroller.scrollLeft + 20 || x > scroller.scrollLeft + scroller.clientWidth - 40) scroller.scrollLeft = x - scroller.clientWidth / 3; }
    if(old >= 0 && hits[old]) drawHL(hits[old].page);
    drawHL(h.page); countUI(); update();
  }
  function snippet(h){
    var t = texts[h.page].full, a = Math.max(0, h.a - 40), b = Math.min(t.length, h.b + 60);
    return (a ? '…' : '') + esc(t.slice(a, h.a)) + '<mark>' + esc(t.slice(h.a, h.b)) + '</mark>' + esc(t.slice(h.b, b)) + (b < t.length ? '…' : '');
  }
  $('sList').onclick = function(){
    if(!hits.length){ return; }
    var shown = hits.slice(0, 300), h = shown.map(function(x, i){
      return '<button class="row" data-h="' + i + '"><b>p.' + label(x.page) + '</b><span class="sn">' + snippet(x) + '</span></button>';
    }).join('');
    if(hits.length > 300) h += '<div class="row sec">Showing the first 300 of ' + hits.length + '. Type more to narrow it down.</div>';
    openSheet(hits.length + ' matches', h);
  };
  var sTimer = 0;
  $('sq').addEventListener('input', function(){ query = this.value; clearTimeout(sTimer); sTimer = setTimeout(function(){ runSearch(false); if(hits.length) goHit(0); }, 220); });
  $('sq').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); if(query !== this.value) query = this.value; if(cur < 0){ runSearch(false); goHit(0); } else goHit(e.shiftKey ? cur - 1 : cur + 1); } });
  $('sNext').onclick = function(){ if(cur < 0) goHit(0); else goHit(cur + 1); };
  $('sPrev').onclick = function(){ if(cur < 0) goHit(hits.length - 1); else goHit(cur - 1); };
  $('bSearch').onclick = function(){ var on = $('sbar').classList.toggle('on'); if(on){ $('sq').focus(); countUI(); } else clearSearch(); layout(); invalidate(); };
  $('sClose').onclick = function(){ $('sbar').classList.remove('on'); clearSearch(); layout(); invalidate(); };
  function clearSearch(){ query = ''; $('sq').value = ''; runSearch(false); $('scount').textContent = ''; }

  /* ---------- boot ---------- */
  function parseHash(){
    var o = {}; location.hash.replace(/^#/, '').split('&').forEach(function(p){ var kv = p.split('='); if(kv[0]) o[kv[0]] = decodeURIComponent(kv[1] || ''); }); return o;
  }
  pdfjsLib.getDocument({ url: PDF_URL, standardFontDataUrl: 'lib/pdfjs/standard_fonts/', disableRange: true, disableStream: true }).promise.then(async function(doc){
    pdf = doc; N = doc.numPages;
    var p1 = await doc.getPage(1), v = p1.getViewport({ scale: 1 }); W0 = v.width; H0 = v.height;
    $('pgtot').textContent = '/ ' + (N - OFFSET);
    buildPages(); msg.remove();
    var h = parseHash(), start = h.p ? parseInt(h.p, 10) : parseInt(ls(STORE) || '1', 10);
    if(!(start >= 1)) start = 1;
    goPage(toPdfPage(start));
    if(h.p === 'c') goPage(1);
    update();
    buildIndex();
    if(h.q){ $('sbar').classList.add('on'); $('sq').value = h.q; query = h.q; layout(); invalidate(); }
  }).catch(function(err){
    msg.textContent = 'Could not open the book. Check your connection and reload.';
    console.error(err);
  });
  window._bk = { goPage: goPage, setZoom: function(v){ setZoom(v); }, state: function(){ return { z: z, scale: scale, curPage: curPage, indexed: indexed, hits: hits.length, cur: cur }; }, search: function(q){ $('sbar').classList.add('on'); $('sq').value = q; query = q; runSearch(false); if(hits.length) goHit(0); } };
})();
</script>
</body>
</html>
